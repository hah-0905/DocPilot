services:
  mysql:
    image: mysql:8.0
    container_name: docpilot-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: docpilot
      MYSQL_USER: docpilot
      MYSQL_PASSWORD: docpilot123456
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123456"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./docpilot-backend
    container_name: docpilot-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_NAME: docpilot-backend
      APP_ENV: dev
      DEBUG: "true"
      DATABASE_URL: mysql+aiomysql://docpilot:docpilot123456@mysql:3306/docpilot?charset=utf8mb4
      OPENAI_API_KEY: your_api_key_here
      OPENAI_BASE_URL: https://api.openai.com/v1
      MODEL_NAME: gpt-4o-mini
      EMBEDDING_MODEL: text-embedding-3-small
    ports:
      - "8000:8000"
    volumes:
      - ./docpilot-backend:/app

  frontend:
    image: node:20-alpine
    container_name: docpilot-frontend
    restart: unless-stopped
    working_dir: /app
    depends_on:
      - backend
    environment:
      VITE_BACKEND_URL: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ./docpilot-front-end:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm ci && npm run dev"

volumes:
  mysql_data:
  frontend_node_modules: