services:
  mysql:
    image: mysql:8.0
    container_name: docpilot-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --silent -uroot -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./docpilot-backend
    container_name: docpilot-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_NAME: docpilot-backend
      APP_ENV: dev
      DEBUG: "true"
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: https://api.openai.com/v1
      MODEL_NAME: gpt-4o-mini
      EMBEDDING_MODEL: text-embedding-3-small
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./docpilot-backend:/app

  frontend:
    image: node:20-alpine
    container_name: docpilot-frontend
    restart: unless-stopped
    working_dir: /app
    depends_on:
      - backend
    environment:
      VITE_BACKEND_URL: http://backend:8000
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./docpilot-front-end:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm ci && npm run dev"

volumes:
  mysql_data:
  frontend_node_modules:
